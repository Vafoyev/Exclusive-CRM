<!-- Global Search Results (HTMX partial) -->
<div class="divide-y divide-slate-100">
    {% if results %}
    {% for result in results %}
    <a href="{{ result.url }}"
        class="flex items-center gap-3 p-3 hover:bg-slate-50 transition group">
        <div class="w-10 h-10 rounded-xl 
                {% if result.type == 'user' %}bg-[#94A3B8]/10 text-[#64748B]
                {% elif result.type == 'lead' %}bg-green-100 text-green-600
                {% else %}bg-purple-100 text-purple-600{% endif %}
                flex items-center justify-center">
            <i class="ph {{ result.icon }} text-xl"></i>
        </div>
        <div class="flex-1 min-w-0">
            <p class="font-medium text-slate-800 truncate group-hover:text-[#64748B]">
                {{ result.title }}
            </p>
            <p class="text-xs text-slate-500 truncate">{{ result.subtitle }}</p>
        </div>
        <i class="ph ph-arrow-right text-slate-400 group-hover:text-[#64748B] transition"></i>
    </a>
    {% endfor %}
    {% else %}
    <div class="p-6 text-center text-slate-500">
        <i class="ph ph-magnifying-glass text-3xl mb-2"></i>
        <p>"{{ query }}" bo'yicha hech narsa topilmadi</p>
    </div>
    {% endif %}
</div>
