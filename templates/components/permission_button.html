{% if has_permission %}
<a href="{{ url }}" class="{{ css_class }}">
    {% if icon %}<i class="{{ icon }}"></i>{% endif %}
    {{ text }}
</a>
{% else %}
<button type="button" disabled
    class="opacity-50 cursor-not-allowed {{ css_class }}"
    title="Sizda '{{ text }}' amali uchun ruxsat yo'q">
    {% if icon %}<i class="{{ icon }}"></i>{% endif %}
    {{ text }}
</button>
{% endif %}
