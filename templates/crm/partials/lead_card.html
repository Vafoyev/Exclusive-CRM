<!-- Lead Card - HTMX partial -->
<div class="lead-card bg-white rounded-xl p-4 shadow-sm border border-slate-100 hover:shadow-md transition cursor-pointer"
     id="lead-{{ lead.id }}"
     hx-get="{% url 'crm:lead_detail' lead.id %}"
     hx-target="#modal-content"
     hx-trigger="click">

    <div class="flex items-start justify-between mb-3">
        <div>
            <h4 class="font-semibold text-slate-800">{{ lead.full_name }}</h4>
            <p class="text-sm text-slate-500">{{ lead.phone }}</p>
        </div>
        <div class="flex gap-1">
            <button class="p-1.5 text-slate-400 hover:text-blue-600 rounded-lg hover:bg-blue-50 transition"
                    hx-get="{% url 'crm:lead_edit' lead.id %}"
                    hx-target="#modal-content"
                    hx-trigger="click"
                    onclick="event.stopPropagation()">
                <i class="ph ph-pencil-simple text-sm"></i>
            </button>
            <button class="p-1.5 text-slate-400 hover:text-red-600 rounded-lg hover:bg-red-50 transition"
                    hx-delete="{% url 'crm:htmx_delete_lead' lead.id %}"
                    hx-confirm="Bu lidni o'chirishni xohlaysizmi?"
                    hx-target="#lead-{{ lead.id }}"
                    hx-swap="outerHTML"
                    onclick="event.stopPropagation()">
                <i class="ph ph-trash text-sm"></i>
            </button>
        </div>
    </div>

    {% if lead.interested_course %}
    <div class="flex items-center gap-2 text-xs text-slate-500 mb-2">
        <i class="ph ph-book-open"></i>
        <span>{{ lead.interested_course.name }}</span>
    </div>
    {% endif %}

    {% if lead.source %}
    <div class="flex items-center gap-2">
        <span class="px-2 py-1 bg-slate-100 text-slate-600 text-xs rounded-lg">
            {{ lead.source.name }}
        </span>
    </div>
    {% endif %}

    <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
        <span>{{ lead.created_at|timesince }} oldin</span>
        {% if lead.assigned_to %}
        <span class="flex items-center gap-1">
            <i class="ph ph-user"></i>
            {{ lead.assigned_to.first_name }}
        </span>
        {% endif %}
    </div>
</div>
