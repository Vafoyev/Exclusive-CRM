{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">{{ title }}</h1>
            <p class="text-slate-400">Do'kon kategoriyasini sozlang</p>
        </div>
        <a href="{% url 'operations:shop_category_list' %}"
            class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
            <i class="ph ph-arrow-left"></i> Orqaga
        </a>
    </div>

    <div class="rounded-2xl p-6 bg-white border border-slate-200">
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">Kategoriya nomi *</label>
                <input type="text" name="name" value="{{ category.name|default:'' }}" required
                    class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4F46E5]/30"
                    placeholder="Masalan: Kitoblar">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">Ikonka (emoji)</label>
                <input type="text" name="icon" value="{{ category.icon|default:'📦' }}"
                    class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800 text-2xl placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4F46E5]/30"
                    placeholder="📦">
                <p class="text-xs text-slate-500 mt-1">Emoji tanlang: 📚 📱 🎁 💸 🎧 👕 ✏️</p>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">Tartib raqami</label>
                <input type="number" name="order" value="{{ category.order|default:0 }}"
                    class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4F46E5]/30"
                    placeholder="0">
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit"
                    class="flex-1 px-6 py-3 bg-gradient-to-r from-[#818CF8] to-violet-600 text-slate-800 rounded-xl hover:shadow-lg transition font-medium">
                    <i class="ph ph-check"></i> Saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
