{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow-lg text-center">
    <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="ph ph-warning text-3xl"></i>
    </div>
    <h2 class="text-xl font-bold text-slate-800">Rostdan ham o'chirasizmi?</h2>
    <p class="text-slate-500 mt-2">Siz <b>{{ user.first_name }} {{ user.last_name }}</b> ni o'chirmoqchisiz. Bu amalni ortga qaytarib bo'lmaydi.</p>
    
    <form method="post" class="mt-6 flex justify-center gap-3">
        {% csrf_token %}
        <a href="{% url 'users:user_list' %}" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg">Bekor qilish</a>
        <button type="submit" class="px-4 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700">
            Ha, o'chirilsin
        </button>
    </form>
</div>
{% endblock %}
