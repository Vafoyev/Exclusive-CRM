{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border-color)] overflow-hidden shadow-sm">

        <!-- Header -->
        <div class="p-6 border-b border-[var(--border-color)] bg-[var(--bg-hover)]">
            <h2 class="text-xl font-bold text-[var(--text-main)] flex items-center gap-2">
                <i class="ph ph-folder-plus text-indigo-400"></i>
                {{ title }}
            </h2>
        </div>

        <form method="post" class="p-6 space-y-5">
            {% csrf_token %}

            <!-- Nomi -->
            <div>
                <label class="block text-sm font-medium text-[var(--text-second)] mb-2">
                    Kategoriya nomi *
                </label>
                <input type="text" name="name" required
                    class="w-full px-4 py-3 bg-[var(--bg-hover)] border border-[var(--border-color)] text-[var(--text-main)] rounded-xl focus:border-[var(--primary)] focus:outline-none transition"
                    placeholder="M: Video darslar">
            </div>

            <!-- Ikonka -->
            <div>
                <label class="block text-sm font-medium text-[var(--text-second)] mb-2">
                    Ikonka (emoji)
                </label>
                <input type="text" name="icon" value="📁" maxlength="10"
                    class="w-full px-4 py-3 bg-[var(--bg-hover)] border border-[var(--border-color)] text-[var(--text-main)] rounded-xl focus:border-[var(--primary)] focus:outline-none text-2xl transition"
                    placeholder="📁">
                <p class="text-xs text-[var(--text-muted)] mt-1.5">Misol: 🎬 📄 🎧 📝 📦</p>
            </div>

            <!-- Tugmalar -->
            <div class="flex gap-3 pt-4 border-t border-[var(--border-color)]">
                <button type="submit"
                    class="flex-1 py-3 bg-[var(--primary)] text-white font-medium rounded-xl hover:opacity-90 transition flex items-center justify-center gap-2 shadow-sm">
                    <i class="ph ph-check-circle"></i> Saqlash
                </button>
                <a href="{% url 'material_category_list' %}"
                    class="px-6 py-3 bg-[var(--bg-hover)] border border-[var(--border-color)] text-[var(--text-second)] hover:text-[var(--text-main)] rounded-xl hover:border-[var(--border-hover)] transition flex items-center gap-2">
                    <i class="ph ph-x"></i> Bekor
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
