{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center gap-4">
        <a href="{% url 'finance:account_list' %}" class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200 transition">
            <i class="ph ph-arrow-left text-xl text-slate-700"></i>
        </a>
        <h1 class="text-2xl font-bold text-slate-800">{{ title }}</h1>
    </div>

    <!-- Form -->
    <form method="POST" class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Kassa nomi *</label>
            {{ form.name }}
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Turi *</label>
            {{ form.account_type }}
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Boshlang'ich Balans</label>
            {{ form.balance }}
        </div>

        <div class="flex justify-end gap-4 pt-4 border-t border-slate-100">
            <a href="{% url 'finance:account_list' %}"
                class="px-6 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition">
                Bekor qilish
            </a>
            <button type="submit" class="px-6 py-2 bg-[#4F46E5] hover:bg-[#4338CA] text-white rounded-lg transition flex items-center gap-2 shadow-lg shadow-primary-500/25">
                <i class="ph ph-check"></i> Saqlash
            </button>
        </div>
    </form>

</div>
{% endblock %}
