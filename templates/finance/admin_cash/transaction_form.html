{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center gap-4">
        <a href="{% url 'finance:admin_cash_dashboard' %}"
            class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200 transition">
            <i class="ph ph-arrow-left text-xl"></i>
        </a>
        <h1 class="text-2xl font-bold text-slate-800">{{ title }}</h1>
    </div>

    <!-- Form -->
    <form method="POST" class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 space-y-6">
        {% csrf_token %}

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Kategoriya</label>
                {{ form.category }}
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Summa *</label>
                {{ form.amount }}
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">To'lov usuli *</label>
            {{ form.payment_method }}
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Izoh</label>
            {{ form.description }}
        </div>

        <div class="flex justify-end gap-4 pt-4 border-t">
            <a href="{% url 'finance:admin_cash_dashboard' %}"
                class="px-6 py-2 bg-slate-100 text-slate-700 rounded-lg hover:bg-slate-200 transition">
                Bekor qilish
            </a>
            <button type="submit" class="px-6 py-2 
                {% if type == 'income' %}bg-green-500 hover:bg-green-600{% else %}bg-red-500 hover:bg-red-600{% endif %} 
                text-white rounded-lg transition flex items-center gap-2">
                <i class="ph ph-check"></i> Saqlash
            </button>
        </div>
    </form>

</div>
{% endblock %}
