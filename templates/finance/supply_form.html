{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">{{ title }} 📦</h1>
            <p class="text-slate-400">Material ma'lumotlarini kiriting</p>
        </div>
        <a href="{% url 'finance:supply_list' %}" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200">
            <i class="ph ph-arrow-left"></i> Orqaga
        </a>
    </div>

    <div class="rounded-2xl p-6 bg-white border border-slate-200">
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">Material nomi *</label>
                <input type="text" name="name" value="{{ supply.name|default:'' }}" required
                    class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#4F46E5]/30"
                    placeholder="Masalan: A4 qog'oz">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">Kategoriya</label>
                    <select name="category" class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800">
                        <option value="">Tanlang...</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if supply.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">O'lchov birligi</label>
                    <select name="unit" class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800">
                        <option value="dona" {% if supply.unit == 'dona' %}selected{% endif %}>dona</option>
                        <option value="pachka" {% if supply.unit == 'pachka' %}selected{% endif %}>pachka</option>
                        <option value="korobka" {% if supply.unit == 'korobka' %}selected{% endif %}>korobka</option>
                        <option value="kg" {% if supply.unit == 'kg' %}selected{% endif %}>kg</option>
                        <option value="litr" {% if supply.unit == 'litr' %}selected{% endif %}>litr</option>
                        <option value="metr" {% if supply.unit == 'metr' %}selected{% endif %}>metr</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">Joriy miqdor</label>
                    <input type="number" name="quantity" value="{{ supply.quantity|default:0 }}"
                        class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800" min="0">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">Min. miqdor</label>
                    <input type="number" name="min_quantity" value="{{ supply.min_quantity|default:5 }}"
                        class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800" min="0">
                    <p class="text-xs text-slate-500 mt-1">Ogohlantirish uchun</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2">Narxi (so'm)</label>
                    <input type="number" name="unit_price" value="{{ supply.unit_price|default:0 }}"
                        class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800" min="0" step="100">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-2">Tavsif</label>
                <textarea name="description" rows="2"
                    class="w-full px-4 py-3 rounded-xl border bg-slate-50 border-slate-200 text-slate-800 placeholder-slate-400"
                    placeholder="Qo'shimcha ma'lumot...">{{ supply.description|default:'' }}</textarea>
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 px-6 py-3 bg-gradient-to-r from-emerald-500 to-green-600 text-slate-800 rounded-xl font-medium hover:shadow-lg transition">
                    <i class="ph ph-check"></i> Saqlash
                </button>
                <a href="{% url 'finance:supply_list' %}" class="px-6 py-3 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 transition">
                    Bekor qilish
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
