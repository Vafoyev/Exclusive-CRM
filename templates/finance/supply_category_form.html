{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold text-[var(--text-main)]">{{ title }}</h1>
        <a href="{% url 'finance:supply_category_list' %}" class="px-4 py-2 rounded-xl bg-[var(--bg-hover)] border border-[var(--border-color)] text-[var(--text-second)] hover:text-[var(--text-main)] transition text-sm">
            <i class="ph ph-arrow-left"></i> Orqaga
        </a>
    </div>

    <div class="rounded-2xl p-6 bg-[var(--bg-card)] border border-[var(--border-color)] shadow-sm">
        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-[var(--text-second)] mb-2">Kategoriya nomi *</label>
                <input type="text" name="name" value="{{ category.name|default:'' }}" required
                    class="w-full px-4 py-3 rounded-xl border bg-[var(--bg-hover)] border-[var(--border-color)] text-[var(--text-main)] placeholder-[var(--text-muted)] focus:outline-none focus:border-[var(--primary)]"
                    placeholder="Masalan: Tozalik vositalari">
            </div>
            <button type="submit" class="w-full px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium transition shadow-sm flex items-center justify-center gap-2">
                <i class="ph ph-check"></i> Saqlash
            </button>
        </form>
    </div>
</div>
{% endblock %}
